<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetManager — Fiber & Link Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav">
 <div class="brand"><div class="logo" data-i="globe"></div><div><b>NetManager</b><small>Fiber &amp; Link Inventory</small></div></div>
 <div class="lbl">Overview</div>
 <button class="n" data-v="dash" data-i="dash" onclick="go('dash')">Dashboard</button>
 <button class="n" data-v="map" data-i="map" onclick="go('map')">Map</button>
 <div class="lbl">Manage</div>
 <button class="n" data-v="links" data-i="link" onclick="go('links')">Links</button>
 <button class="n" data-v="nodes" data-i="node" onclick="go('nodes')">Nodes / Devices</button>
 <button class="n" data-v="issues" data-i="alert" onclick="go('issues')">Issues <em id="ib" style="display:none"></em></button>
 <div class="lbl">Quick add</div>
 <button class="n" data-i="plus" onclick="openForm('node')">Add Node</button>
 <button class="n" data-i="plus" onclick="openForm('link')">Add Link</button>
 <div class="lbl">Data</div>
 <button class="n" data-i="down" onclick="exportData()">Export JSON</button>
 <button class="n" data-i="down" onclick="exportCSV()">Export CSV (Excel)</button>
 <button class="n" data-i="up" onclick="$('f').click()">Import JSON</button>
 <button class="n" data-i="refresh" onclick="loadFile()">Load repo data.json</button>
 <div id="dirty">● Save করা হয়নি। Export করে repo তে <b>data.json</b> commit করো।</div>
 <input type="file" id="f" accept=".json" hidden>
</nav>
<div id="scrim" onclick="$('nav').classList.remove('open')"></div>
<div id="wrap">
 <header id="top">
  <button id="burger" data-i="menu" onclick="$('nav').classList.toggle('open')"></button>
  <h2 id="title"></h2>
  <div class="sb" id="sb"><span class="si" data-i="search"></span><input id="q" placeholder="Search name, VLAN, link ID, port, NTTN, area…  ( / )"></div>
  <span id="fL"><select id="fr" onchange="render()"><option value="">All roles</option><option>Primary</option><option>Secondary</option></select>
  <select id="fmd" onchange="render()"><option value="">All medium</option></select>
  <select id="fs" onchange="render()"><option value="">All status</option><option>Active</option><option>Planned</option><option>Down</option></select></span>
  <select id="ft" onchange="render()"><option value="">All types</option></select>
 </header>
 <div id="main">
  <div class="view" id="v-dash"></div>
  <div class="view" id="v-map"><div id="map"></div></div>
  <div class="view" id="v-links"></div>
  <div class="view" id="v-nodes"></div>
  <div class="view" id="v-issues"></div>
  <div id="det"></div>
 </div>
</div>
<div id="ov"><form id="fm"></form></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/views.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/tables.js"></script>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
